
services:
    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000' # Port API
            - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001' # Port Console (UI)
        environment:
            MINIO_ROOT_USER: 'root'
            MINIO_ROOT_PASSWORD: 'password'
        volumes:
            - 'minio_data:/data'
        command: minio server /data --console-address ":9001"
        networks:
            - sail

    createbuckets:
        image: minio/mc
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            set -e;
            until /usr/bin/mc alias set myminio http://minio:9000 root password; do
              echo 'MinIO non prêt, nouvelle tentative dans 2s...';
              sleep 2;
            done;
            /usr/bin/mc mb -p myminio/${AWS_BUCKET:-mibeko-documents} || true;
            /usr/bin/mc anonymous set none myminio/${AWS_BUCKET:-mibeko-documents} || true;
            exit 0;
            "
        networks:
            - sail

    postgres:
        image: 'pgvector/pgvector:pg16'
        container_name: 'postgres-mibeko'
        ports:
            - '${FORWARD_POSTGRES_PORT:-5433}:5432'
        environment:
            # Identifiants du Postgres de DÉVELOPPEMENT, volontairement découplés des
            # variables DB_* du .env : celles-ci peuvent pointer la production (tunnel
            # SSH), et la base locale ne doit jamais en hériter — sinon la suite de
            # tests, qui vise root/root sur 5433 (cf. phpunit.xml), perd son accès.
            POSTGRES_USER: '${LOCAL_DB_USERNAME:-root}'
            POSTGRES_PASSWORD: '${LOCAL_DB_PASSWORD:-root}'
            POSTGRES_DB: '${LOCAL_DB_DATABASE:-mibeko-db}'
        volumes:
            - 'postgres_data:/var/lib/postgresql/data'
        networks:
            - sail

    # dbeaver:
    #     image: 'dbeaver/cloudbeaver:latest'
    #     container_name: 'dbeaver-mibeko'
    #     ports:
    #         - '${FORWARD_DBEAVER_PORT:-8978}:8978'
    #     volumes:
    #         - 'dbeaver_workspace:/opt/cloudbeaver/workspace'
    #     networks:
    #         - sail
    #     depends_on:
    #         - postgres
volumes:
    minio_data:
        driver: local
    postgres_data:
        driver: local
    # dbeaver_workspace:
    #     driver: local
networks:
    sail:
        driver: bridge
